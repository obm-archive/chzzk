name: test-channel
# 채널의 다시보기 목록을 자동으로 읽을 수 있는지 확인하는 테스트 (다운로드/요약 없음)
on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "치지직 채널 ID"
        required: true
        default: "0f9a3b4fbb0e7137d1f0b4d70563031c"

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 다시보기 목록 조회 (비공식 API)
        env:
          CH: ${{ inputs.channel_id }}
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "== 채널 정보 =="
          curl -s -w "\nHTTP %{http_code}\n" -A "$UA" "https://api.chzzk.naver.com/service/v1/channels/$CH" | tee out/channel.txt | head -c 1500
          echo
          echo "== 다시보기 목록 =="
          curl -s -w "\nHTTP %{http_code}\n" -A "$UA" \
            "https://api.chzzk.naver.com/service/v1/channels/$CH/videos?sortType=LATEST&pagingType=PAGE&page=0&size=30&publishDateAt=&videoType=" \
            | tee out/videos.txt | head -c 3000
          echo

      - name: 목록 요약 표 만들기
        run: |
          python3 - <<'EOF'
          import json,re,datetime
          raw=open('out/videos.txt',encoding='utf-8').read()
          body=raw.rsplit("\nHTTP",1)[0]
          try:
              d=json.loads(body)
          except Exception as e:
              print("JSON 파싱 실패:",e); raise SystemExit
          c=d.get("content") or {}
          items=c.get("data") or []
          print("총 개수:",c.get("totalCount"),"/ 이번 페이지:",len(items))
          rows=[]
          for v in items:
              dur=v.get("duration") or 0
              rows.append({
                "videoNo":v.get("videoNo"),
                "title":v.get("videoTitle"),
                "publishDate":v.get("publishDate"),
                "duration_min":round(dur/60,1),
                "category":v.get("videoCategoryValue"),
                "type":v.get("videoType"),
                "adult":v.get("adult"),
                "exposure":v.get("exposure"),
                "keys":sorted(v.keys()),
              })
          for r in rows[:30]:
              print(r["videoNo"],r["publishDate"],r["duration_min"],"분",r["title"][:30] if r["title"] else None)
          json.dump(rows,open('out/summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=1)
          if rows: print("필드:",rows[0]["keys"])
          EOF

      - name: yt-dlp로 채널 목록 조회 (대안)
        run: |
          pip install -q -U yt-dlp
          yt-dlp --flat-playlist --playlist-end 5 -J \
            "https://chzzk.naver.com/${{ inputs.channel_id }}/videos" 2>&1 | head -c 1500 | tee out/ytdlp.txt || true

      - name: 결과 저장
        run: |
          N=${{ github.run_number }}
          mkdir -p results/run-$N-channel
          cp out/* results/run-$N-channel/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results
          git commit -m "test-channel result run-$N" || true
          git pull --rebase -q || true
          git push || true
