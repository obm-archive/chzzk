name: Test summary (Groq Whisper + Gemini text)

# Manual test: download a clip, transcribe with Groq Whisper in 10-minute chunks,
# summarize the transcript with Gemini, and commit the report under results/.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "CHZZK VOD URL"
        required: true
        type: string
      start_min:
        description: "Clip start (minutes from the beginning)"
        required: true
        default: "0"
        type: string
      minutes:
        description: "Clip length (minutes)"
        required: true
        default: "30"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOD_URL: ${{ inputs.url }}
      START_MIN: ${{ inputs.start_min }}
      MINUTES: ${{ inputs.minutes }}
      GROQ_API: ${{ secrets.GROQ_API }}
      GEMINI_API: ${{ secrets.GEMINI_API }}
      CHUNK_SEC: "600"
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade yt-dlp google-genai requests

      - name: Restore cached audio chunks
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work/chunks
          key: chunks-v1-${{ inputs.start_min }}-${{ inputs.minutes }}-${{ inputs.url }}

      - name: List available formats
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yt-dlp --no-playlist -F "$VOD_URL" || true

      - name: Download clip (low quality)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          START=$((START_MIN * 60))
          END=$(((START_MIN + MINUTES) * 60))
          mkdir -p work
          SECONDS=0
          yt-dlp --no-playlist \
            -f "bv*[height<=480]+ba/b[height<=480]/worst" \
            --download-sections "*${START}-${END}" \
            --downloader-args "ffmpeg_i:-allowed_extensions ALL -extension_picky 0" \
            -o "work/clip.%(ext)s" \
            "$VOD_URL"
          echo "download seconds: $SECONDS"
          ls -lh work

      - name: Extract audio chunks
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          CLIP=$(ls work/clip.* | head -n 1)
          mkdir -p work/chunks
          ffmpeg -v error -i "$CLIP" -vn -ac 1 -ar 16000 -b:a 48k \
            -f segment -segment_time "$CHUNK_SEC" -reset_timestamps 1 \
            work/chunks/c_%03d.mp3
          ls -lh work/chunks

      - name: Save audio chunks to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/chunks
          key: chunks-v1-${{ inputs.start_min }}-${{ inputs.minutes }}-${{ inputs.url }}

      - name: Transcribe (Groq) and summarize (Gemini)
        run: |
          python scripts/groq_pipeline.py work/chunks \
            "results/run-${{ github.run_number }}-groq" \
            "$((START_MIN * 60))" "$CHUNK_SEC" glossary/terms.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Add Groq+Gemini test results (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main
