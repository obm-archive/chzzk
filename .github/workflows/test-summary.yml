name: Test summary (Gemini)

# Manual test: download a clip of a CHZZK VOD, extract audio + frames,
# summarize with Gemini, and commit the report under results/.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "CHZZK VOD URL"
        required: true
        type: string
      start_min:
        description: "Clip start (minutes from the beginning)"
        required: true
        default: "0"
        type: string
      minutes:
        description: "Clip length (minutes)"
        required: true
        default: "30"
        type: string

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOD_URL: ${{ inputs.url }}
      START_MIN: ${{ inputs.start_min }}
      MINUTES: ${{ inputs.minutes }}
      SUMMARY_API: ${{ secrets.SUMMARY_API }}
      FRAME_INTERVAL: "60"
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade yt-dlp google-genai

      - name: Download clip (low quality)
        run: |
          START=$((START_MIN * 60))
          END=$(((START_MIN + MINUTES) * 60))
          mkdir -p work
          yt-dlp --no-playlist \
            -f "bv*[height<=480]+ba/b[height<=480]/worst" \
            --download-sections "*${START}-${END}" \
            --downloader-args "ffmpeg_i:-allowed_extensions ALL -extension_picky 0" \
            -o "work/clip.%(ext)s" \
            "$VOD_URL"
          ls -lh work

      - name: Extract audio and frames
        run: |
          CLIP=$(ls work/clip.* | head -n 1)
          ffmpeg -v error -i "$CLIP" -vn -ac 1 -ar 16000 -b:a 48k work/audio.mp3
          mkdir -p work/frames
          ffmpeg -v error -i "$CLIP" -vf "fps=1/${FRAME_INTERVAL},scale=640:-2" -q:v 4 work/frames/f_%04d.jpg
          ls -lh work/audio.mp3
          echo "frames: $(ls work/frames | wc -l)"

      - name: Summarize with Gemini
        run: |
          python scripts/summarize.py work/audio.mp3 work/frames \
            "results/run-${{ github.run_number }}" \
            "$((START_MIN * 60))" "$FRAME_INTERVAL"

      - name: Save frames and commit results
        run: |
          OUT="results/run-${{ github.run_number }}"
          mkdir -p "$OUT/frames"
          cp work/frames/*.jpg "$OUT/frames/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Add summary test results (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main
